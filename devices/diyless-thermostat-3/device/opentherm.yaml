# =============================================================================
# OPENTHERM - Boiler control entities (central heating + hot water)
# =============================================================================
# Entities from the board's stock DIYLESS thermostat config, adapted to plain
# HA entities instead of custom LVGL pages: espcontrol's own grid exposes them
# via its Climate/Switch/Sensor card types, configured from the web UI like
# any other Home Assistant entity. The PID loop's current temperature comes
# from the board's built-in AHT20 sensor.
#
# The PID gains below are only first-boot defaults (estimated for radiators
# from a winter of on/off thermostat history: integral time ~4 hours to suit
# the house's slow response): Home Assistant can replace them at runtime via the
# set_heating_pid_parameters action, and the device restores the last values
# it was given on every boot.
# =============================================================================

substitutions:
  heating_pid_default_kp: "0.3"
  heating_pid_default_ki: "0.00002"
  heating_pid_default_kd: "0"

globals:
  - id: heating_pid_kp
    type: float
    restore_value: true
    initial_value: '${heating_pid_default_kp}'
  - id: heating_pid_ki
    type: float
    restore_value: true
    initial_value: '${heating_pid_default_ki}'
  - id: heating_pid_kd
    type: float
    restore_value: true
    initial_value: '${heating_pid_default_kd}'

api:
  actions:
    - action: set_heating_pid_parameters
      variables:
        kp: float
        ki: float
        kd: float
      then:
        - if:
            condition:
              lambda: |-
                return std::isfinite(kp) && std::isfinite(ki) && std::isfinite(kd) &&
                       kp >= 0 && ki >= 0 && kd >= 0;
            then:
              - globals.set:
                  id: heating_pid_kp
                  value: !lambda 'return kp;'
              - globals.set:
                  id: heating_pid_ki
                  value: !lambda 'return ki;'
              - globals.set:
                  id: heating_pid_kd
                  value: !lambda 'return kd;'
              - script.execute: apply_heating_pid_parameters
            else:
              - lambda: 'ESP_LOGW("heating_pid", "Rejected PID parameters kp=%g ki=%g kd=%g: must be finite and >= 0", kp, ki, kd);'

script:
  # Pushes the stored gains into the running PID loop. The controller keeps
  # its integral already scaled by ki, so changing gains never makes the
  # boiler setpoint jump.
  - id: apply_heating_pid_parameters
    then:
      - climate.pid.set_control_parameters:
          id: ch_climate
          kp: !lambda 'return id(heating_pid_kp);'
          ki: !lambda 'return id(heating_pid_ki);'
          kd: !lambda 'return id(heating_pid_kd);'
      - lambda: 'ESP_LOGI("heating_pid", "Applied PID parameters kp=%g ki=%g kd=%g", id(heating_pid_kp), id(heating_pid_ki), id(heating_pid_kd));'

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Built In Sensor Temperature"
      id: builtin_sensor
    humidity:
      name: "Built In Sensor Humidity"
    update_interval: 60s

  - platform: opentherm
    t_boiler:
      id: ch_temperature
      name: "Heating Temperature"
    t_dhw:
      id: dhw_temperature
      name: "Hot Water Temperature"
    t_dhw2:
      id: dhw_temperature_2
      name: "Hot Water Temperature 2"
    rel_mod_level:
      id: rel_mod_level
      name: "Boiler Relative Modulation Level"
    t_outside:
      id: outside_temperature
      name: "Outside Temperature"
    t_ret:
      id: return_temperature
      name: "Return Water Temperature"
    max_t_set:
      id: max_ch_setpoint
      name: "Max CH Setpoint"
    max_t_set_ub:
      id: max_ch_setpoint_ub
      name: "Upper Bound of CH Setpoint"
    max_t_set_lb:
      id: max_ch_setpoint_lb
      name: "Lower Bound CH Setpoint"
    t_exhaust:
      id: exhaust_temperature
      name: "Boiler Exhaust Temperature"
      entity_category: diagnostic
    ch_pressure:
      id: ch_water_pressure
      name: "Water Pressure"
      entity_category: diagnostic
    oem_fault_code:
      id: oem_fault_code
      name: "OEM Fault Code"
      entity_category: diagnostic
    oem_diagnostic_code:
      id: oem_diagnostic_code
      name: "OEM Diagnostic Code"
      entity_category: diagnostic

  - platform: pid
    id: pid_result
    name: "Heating PID Result"
    climate_id: ch_climate
    type: RESULT
    entity_category: diagnostic
  - platform: pid
    id: pid_error
    name: "Heating PID Error"
    climate_id: ch_climate
    type: ERROR
    internal: true
  - platform: pid
    id: pid_proportional
    name: "Heating PID Proportional"
    climate_id: ch_climate
    type: PROPORTIONAL
    entity_category: diagnostic
  - platform: pid
    id: pid_integral
    name: "Heating PID Integral"
    climate_id: ch_climate
    type: INTEGRAL
    entity_category: diagnostic
  - platform: pid
    id: pid_derivative
    name: "Heating PID Derivative"
    climate_id: ch_climate
    type: DERIVATIVE
    internal: true

output:
  - platform: opentherm
    t_set:
      id: ch_setpoint
      min_value: 30
      max_value: 80
      zero_means_zero: true

switch:
  - platform: opentherm
    ch_enable:
      id: ch_enable
      name: "Heating"
      restore_mode: RESTORE_DEFAULT_OFF
      internal: false
      on_turn_on:
        - climate.control:
            id: ch_climate
            mode: 'HEAT'
      on_turn_off:
        - climate.control:
            id: ch_climate
            mode: 'OFF'
    dhw_enable:
      id: dhw_enable
      name: "Hot Water"
      restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: opentherm
    ch_active:
      id: ch_active
      name: "Heating Active"
    dhw_active:
      id: dhw_active
      name: "Hot Water Active"
    flame_on:
      id: flame_on
      name: "Flame On"
    fault_indication:
      id: fault_indication
      name: "Boiler Fault"
      entity_category: diagnostic
    diagnostic_indication:
      id: diagnostic_indication
      name: "Boiler Diagnostic"
      entity_category: diagnostic
    service_request:
      name: Service Required
      entity_category: diagnostic
    lockout_reset:
      name: Lockout Reset
      entity_category: diagnostic
    low_water_pressure:
      name: Low Water Pressure Fault
      entity_category: diagnostic
    flame_fault:
      name: Flame Fault
      entity_category: diagnostic
    air_pressure_fault:
      name: Air Pressure Fault
      entity_category: diagnostic
    water_over_temp:
      name: Water Overtemperature
      entity_category: diagnostic

number:
  - platform: opentherm
    t_dhw_set:
      id: dhw_setpoint
      name: "Hot Water Setpoint"
      step: 1
      min_value: 30
      max_value: 80
      restore_value: true
      initial_value: 60

climate:
  - platform: pid
    id: ch_climate
    name: "Heating Climate"
    heat_output: ch_setpoint
    default_target_temperature: 23
    sensor: builtin_sensor
    visual:
      min_temperature: 15
      max_temperature: 30
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    control_parameters:
      kp: ${heating_pid_default_kp}
      ki: ${heating_pid_default_ki}
      kd: ${heating_pid_default_kd}
      output_averaging_samples: 10
    deadband_parameters:
      threshold_high: 0.5
      threshold_low: -0.5
      kp_multiplier: 0
      ki_multiplier: 0.15
      kd_multiplier: 0.0
      deadband_output_averaging_samples: 15
    on_state:
      # Keep the CH-enable switch (and therefore the OpenTherm ch_enable
      # register) in sync with whatever set the climate mode, whether that
      # was the switch itself, HA, or an automation.
      - if:
          condition:
            - lambda: 'return id(ch_climate).mode == CLIMATE_MODE_OFF;'
          then:
            - switch.turn_off: ch_enable
          else:
            - switch.turn_on: ch_enable

esphome:
  on_boot:
    # Contributes the boiler/PID readings above to the Info tab of any local
    # climate card on this device (see register_climate_info_provider in
    # button_grid_climate.h) - the tab itself has no idea these come from
    # OpenTherm, so nothing here needs touching if the card ever changes.
    - then:
        - lambda: |-
            register_climate_info_provider([](std::vector<ClimateInfoRow> &rows) {
              auto fmt = [](float value, int precision, const char *suffix = "") -> std::string {
                if (std::isnan(value)) return "--";
                char buf[24];
                snprintf(buf, sizeof(buf), "%.*f%s", precision, value, suffix);
                return buf;
              };
              rows.push_back({"Heating Temp", fmt(id(ch_temperature).state, 1)});
              rows.push_back({"Hot Water Temp", fmt(id(dhw_temperature).state, 1)});
              rows.push_back({"Outside Temp", fmt(id(outside_temperature).state, 1)});
              rows.push_back({"Return Temp", fmt(id(return_temperature).state, 1)});
              rows.push_back({"Max CH Setpoint", fmt(id(max_ch_setpoint).state, 1)});
              rows.push_back({"Mod Level", fmt(id(rel_mod_level).state, 0, "%")});
              rows.push_back({"Water Pressure", fmt(id(ch_water_pressure).state, 2)});
              rows.push_back({"PID Result", fmt(id(pid_result).state, 3)});
              rows.push_back({"PID Error", fmt(id(pid_error).state, 2)});
              rows.push_back({"PID P", fmt(id(pid_proportional).state, 3)});
              rows.push_back({"PID I", fmt(id(pid_integral).state, 3)});
              rows.push_back({"PID D", fmt(id(pid_derivative).state, 3)});
              rows.push_back({"PID Kp", fmt(id(heating_pid_kp), 3)});
              rows.push_back({"PID Ki", fmt(id(heating_pid_ki), 6)});
              rows.push_back({"PID Kd", fmt(id(heating_pid_kd), 3)});
            });
    # Runs after globals have restored their saved values, so the PID loop
    # picks up the gains last set from Home Assistant instead of the defaults.
    - priority: -100
      then:
        - script.execute: apply_heating_pid_parameters
