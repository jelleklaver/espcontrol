# =============================================================================
# DEV CONFIG - Local development entry point (DIYLESS Thermostat 3)
# =============================================================================
# Flash with: esphome run dev.yaml
# =============================================================================

substitutions:
  cover_art_placeholder_file: "../../common/assets/cover_art_placeholder.svg"
  name: "espcontrol-diyless-thermostat-3"
  friendly_name: "EspControl DIYLESS Thermostat 3"
  espcontrol_component_url: "../.."
  mdi_font_file: "../../common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  espcontrol_component_ref: "HEAD"

# device.yaml's partitions path is relative to device.yaml itself (for remote
# package installs); older ESPHome (e.g. 2026.7) only resolves it relative to
# this file, so local builds point at it explicitly here.
esp32:
  partitions: "../../common/device/partitions_8mb_single_app.csv"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  espcontrol: !include packages.yaml

web_server:
  js_url: ""
  js_include: "../../docs/public/webserver/embedded/www.js"

logger:
  level: DEBUG
